[workspace]
members = ["crates/core", "crates/uefi", "crates/bios", "crates/biosinstall"]
# The UEFI app by default; the others build with their own targets
# (cargo bios) or for the host (the installer helper, tests).
default-members = ["crates/uefi"]
exclude = ["tools/gallery", "installer/windows"]
resolver = "3"

[workspace.package]
version = "0.4.4"
edition = "2024"
license = "MIT"

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
