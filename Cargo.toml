[workspace]
members = ["crates/core", "crates/uefi"]
exclude = ["tools/gallery", "installer/windows"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
