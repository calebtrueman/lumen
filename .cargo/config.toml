[build]
target = "x86_64-unknown-uefi"


# Release builds of Lumen for x86_64 PCs: `cargo efi-x64`. Rust's built-in
# x86_64-unknown-uefi target uses software floating point, which made every
# per-pixel calculation an emulated call (hundreds of ms per frame on real
# hardware); this target uses SSE2. See targets/x86_64-lumen-uefi.json and
# the entry stub in src/main.rs, which makes sure SSE is switched on first.
[alias]
efi-x64 = ["build", "-p", "lumen", "--release", "-Zjson-target-spec", "-Zbuild-std=core,alloc,compiler_builtins", "-Zbuild-std-features=compiler-builtins-mem", "--target", "targets/x86_64-lumen-uefi.json"]
# Lumen for BIOS PCs (32-bit, SSE2): `cargo bios`, then tools/bios/build.sh
# turns the two programs into the disk image the installers write.
bios = ["build", "-p", "lumen-bios", "--release", "-Zjson-target-spec", "-Zbuild-std=core,alloc,compiler_builtins", "-Zbuild-std-features=compiler-builtins-mem", "--target", "targets/i686-lumen-bios.json"]
