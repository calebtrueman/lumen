# Lumen configuration. Lives next to lumen.efi on the EFI system partition.

# Lumen waits until you choose. To start the highlighted entry automatically,
# use the Auto-start button in Lumen's menu (Off, 5, 10 or 30 seconds), or set
# a number of seconds here (0 = immediately). The button overrides this line.
# timeout 10

# Which entry is highlighted: "last" (whatever you booted last time) or part of a title.
default last

# Hide entries whose title or path contains this text (repeatable).
# hide Recovery

# Start matching entries through the firmware's own boot entry (one extra
# reboot). Use this if Windows asks for your BitLocker recovery key when
# started from Lumen.
# bootnext Windows

# Screen mode: keep (firmware default), max, or e.g. 1920x1080.
resolution keep

# clock off

# Extra entries on this partition:  entry Title | \path\to\loader.efi | options
# entry Arch (fallback) | \EFI\Linux\arch-linux.efi | initrd=\initramfs-linux-fallback.img
