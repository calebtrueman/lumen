name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Lumen and installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install   # the pinned nightly, targets and rust-src from rust-toolchain.toml
          (cd installer/windows && rustup toolchain install)   # stable, for the Windows launcher
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode mingw-w64 >/dev/null
      - name: Build (signed with a throwaway test key, not the release key)
        env:
          LUMEN_TEST_KEY: "1"
        run: tools/make-installers.sh
      - name: Installer byte-level checks
        run: python3 tools/test/check_windows_installer.py pwsh
      - name: Shell syntax
        run: for f in install/*.sh; do sh -n "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-TEST-KEY-do-not-install
          path: |
            dist/Lumen-Installer-Windows.exe
            dist/Lumen-Installer-Linux.run
            dist/SHA256SUMS
            dist/x86_64/lumen-windows.ps1
            dist/x86_64/lumen.efi
            dist/x86_64/shimx64.efi
            dist/x86_64/mmx64.efi
            dist/x86_64/lumen.cer
            dist/x86_64/lumen.conf

  windows-install:
    name: Install / heal / uninstall on Windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers-TEST-KEY-do-not-install
      - name: Run the real installer silently and verify
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          "Firmware: $env:firmware_type"
          if ($env:firmware_type -ne 'UEFI') { "::warning::This runner boots in BIOS mode; can't exercise firmware boot entries."; exit 0 }
          try { "Secure Boot: $(Confirm-SecureBootUEFI)" } catch { "Secure Boot: unsupported" }
          "--- what the installer sees ---"
          powershell -NoProfile -ExecutionPolicy Bypass -File x86_64\lumen-windows.ps1 -Diagnose -Bundle x86_64
          "--- firmware boot entries before install ---"
          bcdedit /enum firmware

          "--- script run directly (shows any PowerShell error) ---"
          powershell -NoProfile -ExecutionPolicy Bypass -File x86_64\lumen-windows.ps1 -Yes -Bundle x86_64
          if ($LASTEXITCODE -ne 0) { throw "lumen-windows.ps1 -Yes failed ($LASTEXITCODE)" }
          powershell -NoProfile -ExecutionPolicy Bypass -File x86_64\lumen-windows.ps1 -Uninstall -Bundle x86_64
          Start-Sleep 5

          "--- one-click installer, silent ---"
          $p = Start-Process .\Lumen-Installer-Windows.exe -ArgumentList '/quiet' -Wait -PassThru
          Get-Content "$env:ProgramData\Lumen\installer-output.log" -ErrorAction SilentlyContinue
          $log = Get-Content "$env:ProgramData\Lumen\install.log" -Raw -ErrorAction SilentlyContinue
          $log

          function Check($ok, $what) { if ($ok) { "PASS $what" } else { throw "FAIL $what" } }
          if ($p.ExitCode -ne 0) {
              # Prove nothing was left behind, then fail.
              "::error::installer exit code $($p.ExitCode)"
              mountvol S: /S
              Check (-not (Test-Path 'S:\EFI\lumen')) 'rollback removed ESP files'
              mountvol S: /D
              Check (-not ((bcdedit /enum firmware | Out-String) -match '\s{2,}Lumen\s*(\r?\n|$)')) 'rollback left no boot entry'
              Check (-not ((bcdedit /enum all | Out-String) -match '\s{2,}Lumen\s*(\r?\n|$)')) 'rollback left no BCD object'
              Check (-not (Get-ScheduledTask -TaskName 'Lumen boot order' -ErrorAction SilentlyContinue)) 'no heal task registered'
              Check (-not (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Lumen')) 'no Apps & features entry'
              exit 1
          }
          mountvol S: /S
          foreach ($f in 'shimx64.efi', 'mmx64.efi', 'grubx64.efi', 'lumen.cer', 'lumen.conf') { Check (Test-Path "S:\EFI\lumen\$f") "ESP has $f" }
          mountvol S: /D
          $fw = bcdedit /enum firmware | Out-String
          $fw
          Check ($fw -match 'description\s+Lumen') 'firmware boot entry "Lumen" exists'
          $mgr = bcdedit /enum '{fwbootmgr}' | Out-String
          Check ($mgr -match 'bootsequence') 'Lumen scheduled as next boot only (BootNext)'
          Check ((Get-ScheduledTask -TaskName 'Lumen boot order').State -ne $null) 'heal task registered'
          Check (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Lumen') 'listed in Apps & features'

          Start-ScheduledTask -TaskName 'Lumen boot order'; Start-Sleep 15
          Check ((Get-ScheduledTaskInfo -TaskName 'Lumen boot order').LastTaskResult -eq 0) 'heal task runs cleanly'

          $p = Start-Process .\Lumen-Installer-Windows.exe -ArgumentList '/quiet','/uninstall' -Wait -PassThru
          Check ($p.ExitCode -eq 0) 'uninstall exit code 0'
          Start-Sleep 5
          Check (-not ((bcdedit /enum firmware | Out-String) -match 'description\s+Lumen')) 'boot entry removed'
          Check (-not (Get-ScheduledTask -TaskName 'Lumen boot order' -ErrorAction SilentlyContinue)) 'heal task removed'
          Check (-not (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Lumen')) 'Apps & features entry removed'
          mountvol S: /S
          Check (-not (Test-Path 'S:\EFI\lumen')) 'ESP files removed'
          mountvol S: /D
